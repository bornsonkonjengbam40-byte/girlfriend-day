<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Envelope -->
    <div class="container" id="envelopeSection">

        <div class="envelope" id="envelope">

            <div class="flap"></div>

            <div class="letter">

                <h2>💌</h2>

                <h3>A Little Surprise</h3>

                <p>Tap to Open ❤️</p>

            </div>

        </div>

    </div>

    <!-- Love Card -->
    <div class="card hidden" id="card">

        <!-- Profile -->
        <div class="profile">

            <div class="photo-frame">

                <img src="images/girlfriend.jpeg"
                     alt="My Love"
                     class="profile-photo">

            </div>

        </div>

        <!-- Content -->
        <div class="message-content">

            <h1>❤️ Happy Girlfriend's Day ❤️</h1>

            <h2 class="name">
                To My Beautiful Girl ❤️
            </h2>

            <p class="nickname">
                Abemma ❤️
            </p>

            <div class="divider">

                <span>❤️</span>

                <div class="line"></div>

                <span>❀</span>

                <div class="line"></div>

                <span>❤️</span>

            </div>

            <div class="letter-text">

                <p id="typing"></p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
