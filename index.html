<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Envelope -->
    <div id="envelopeSection">

        <div class="envelope" id="envelope">

            <div class="flap"></div>

            <div class="letter">

                <h2>💌</h2>

                <h3>A Little Surprise</h3>

                <p>Tap to Open ❤️</p>

            </div>

        </div>

    </div>

    <!-- Love Card -->
    <div class="card hidden" id="card">

        <div class="profile">

            <div class="photo-frame">

                <img src="images/gf picture.jpeg" class="profile-photo">

            </div>

        </div>

        <h1>
            ❤️ Happy Girlfriend's Day ❤️
        </h1>

        <h2 class="name">
            To My Beautiful Girl ❤️
        </h2>

        <p class="nickname">
            Abemma ❤️
        </p>

        <div class="divider">

            <span>❤️</span>

            <div class="line"></div>

            ❀

            <div class="line"></div>

            <span>❤️</span>

        </div>

        <div class="message">

            <p id="typing"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
